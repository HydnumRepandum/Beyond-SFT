[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-alignment-pipeline"
version = "0.1.0"
description = "Colab-friendly pipeline for 4-class political superframe classification with PEFT, SFT, DPO, and KTO."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Topic Alignment Research Team" }
]
dependencies = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.0",
  "comet_ml>=3.49.0",
  "datasets>=2.20.0",
  "jsonlines>=4.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "peft>=0.12.0",
  "pyarrow>=16.1.0",
  "pyyaml>=6.0.1",
  "scikit-learn>=1.5.0",
  "seaborn>=0.13.2",
  "sentence-transformers==3.4.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "torchvision==0.20.1",
  "transformers>=4.43.0",
  "trl==0.9.6",
  "tqdm>=4.66.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
